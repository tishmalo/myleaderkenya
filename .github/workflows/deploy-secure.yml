name: Deploy to Prod (cPanel)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, mysql, gd, bcmath, fileinfo, openssl, pdo, pdo_mysql, tokenizer, curl
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install production dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      # public/build is gitignored, so it MUST be built here. Otherwise the
      # reverse mirror below deletes it from the server and every @vite
      # directive throws ViteManifestNotFoundException.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTPS (lftp)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_PATH:     ${{ secrets.FTP_PATH }}   # e.g. /laravel-app or /
        run: |
          set -euo pipefail
          echo "machine ${FTP_SERVER} login ${FTP_USERNAME} password ${FTP_PASSWORD}" > ~/.netrc
          chmod 600 ~/.netrc
          lftp -c "
          set cmd:fail-exit yes;
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          set net:timeout 30;
          set net:max-retries 3;
          set mirror:parallel-transfer-count 4;
          open ${FTP_SERVER};
          mirror --reverse --verbose --delete \
            --no-perms --no-umask \
            --exclude .git/ \
            --exclude .git* \
            --exclude .github/ \
            --exclude node_modules/ \
            --exclude tests/ \
            --exclude .env \
            --exclude .env.* \
            --exclude .idea/ \
            --exclude .vscode/ \
            --exclude .fleet/ \
            --exclude .phpunit.cache/ \
            --exclude '.phpunit.result.cache' \
            --exclude .ftp-deploy-sync-state.json \
            --exclude storage/ \
            --exclude bootstrap/cache/ \
            --exclude vendor/bin/ \
            --exclude public/hot \
            --exclude '*.log' \
            --exclude '*.zip' \
            --exclude .well-known/ \
            --exclude cgi-bin/ \
            --exclude .htpasswd \
            --exclude .ftpquota \
            --exclude .user.ini \
            ./ ${FTP_PATH};
          quit"